[package]
name = "bound-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bound-format = { path = "../crates/bound-format" }
libfuzzer-sys = "0.4"
serde_json = "1"

[[bin]]
name = "artifact"
path = "fuzz_targets/artifact.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "names"
path = "fuzz_targets/names.rs"
test = false
doc = false
bench = false

# A workspace of its own: the fuzzers need nightly and are not part of the
# normal build.
[workspace]
members = ["."]
