[project]
name = "report"
version = "0.1.0"
description = "Render a CSV file as an HTML report (an example for bound)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1"]

[project.scripts]
report = "report.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ty"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
