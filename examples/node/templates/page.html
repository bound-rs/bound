<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; font: 17px/1.6 system-ui, sans-serif; color: #1d1d1f; }
  pre, code { font-family: ui-monospace, monospace; background: #f5f5f7; border-radius: 4px; }

</style>
</head>

</article>
</body>
</html>
