name: Release

# Pushing a tag vX.Y.Z builds `bound` and `bound-launcher` for every
# supported platform and publishes them as a GitHub release: one archive per
# platform, bound-X.Y.Z-<platform>.tar.gz (.zip for Windows), holding a
# directory of the same name, and SHA256SUMS. rules_bound downloads these
# (its platform keys are the <platform> names).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux binaries are static (musl), so that the launcher, which
          # every artifact carries, runs on any Linux distribution. Each
          # platform builds and smoke-tests natively.
          - platform: linux_x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - platform: linux_aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: macos_aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: windows_x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows_aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"$" Cargo.toml || { echo "tag $GITHUB_REF_NAME does not match the version in Cargo.toml" >&2; exit 1; }
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p bound-cli
      - name: Smoke test (Linux, macOS)
        if: runner.os != 'Windows'
        run: scripts/smoke.sh target/${{ matrix.target }}/release
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke.ps1 -Bin target/${{ matrix.target }}/release
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="bound-$version-${{ matrix.platform }}"
          exe=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then exe=".exe"; fi
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/bound$exe" "target/${{ matrix.target }}/release/bound-launcher$exe" README.md LICENSE "$name/"
          if [[ -n "$exe" ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            bound-*.tar.gz
            bound-*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum bound-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "bound ${GITHUB_REF_NAME#v}" \
            --notes "Binaries of bound ${GITHUB_REF_NAME#v} for Linux (static), macOS and Windows. Checksums in SHA256SUMS."
