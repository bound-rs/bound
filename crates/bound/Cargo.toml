[package]
# The crate is bound-cli (the name bound belongs to another crate); the
# command it installs is bound.
name = "bound-cli"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["bundle", "executable", "launcher", "packaging", "self-contained"]
categories = ["command-line-utilities", "development-tools::build-utils"]
default-run = "bound"

[[bin]]
name = "bound"
path = "src/main.rs"

[[bin]]
name = "bound-launcher"
path = "src/bin/bound-launcher.rs"

[dependencies]
bound-format = { workspace = true, features = ["write"] }
bound-platform.workspace = true
bound-runtime.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
