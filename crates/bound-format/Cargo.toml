[package]
name = "bound-format"
description = "The versioned on-disk format of bound artifacts: footer, manifest, payload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Writing artifacts (compression with the reference zstd library). Readers,
# including the launcher, only decode, with a pure-Rust decoder.
write = ["dep:zstd"]

[dependencies]
postcard.workspace = true
ruzstd.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
zstd = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
